<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/equipment-app/" />
    <title>سركات تشغيل المعدات</title>
    
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/sirkat.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a6b8a' rx='20'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23c9a84c'%3E🏗️%3C/text%3E%3C/svg%3E" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a6b8a" />
</head>
<body>
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تم بنجاح</span>
    </div>

    <div id="header"></div>

    <div class="dashboard">
        <div class="sirkat-container" id="sirkatContainer">
            
            <!-- ====== هيدر الصفحة ====== -->
            <div class="sirkat-header" id="sirkatHeader">
                <div class="sirkat-header-top">
                    <div class="sirkat-logo">
                        <img id="sirkatLogo" src="" alt="الشعار" style="display:none;" />
                        <h1 id="sirkatCompanyName">شركة المعدات الحديثة</h1>
                    </div>
                    <div class="sirkat-date">
                        <span id="sirkatMonthYear">أغسطس 2026</span>
                    </div>
                </div>
                <div class="sirkat-header-bottom">
                    <h2><i class="fas fa-clipboard-list"></i> سركات تشغيل المعدات</h2>
                    <p id="sirkatProjectName">مشروع برج الأمل</p>
                </div>
            </div>

            <!-- ====== أدوات التحكم ====== -->
            <div class="sirkat-controls">
                <div class="sirkat-controls-left">
                    <label><i class="fas fa-calendar-alt"></i> الشهر:</label>
                    <select id="sirkatMonth" onchange="updateSirkat()">
                        <option value="0">يناير</option>
                        <option value="1">فبراير</option>
                        <option value="2">مارس</option>
                        <option value="3">أبريل</option>
                        <option value="4">مايو</option>
                        <option value="5">يونيو</option>
                        <option value="6">يوليو</option>
                        <option value="7">أغسطس</option>
                        <option value="8">سبتمبر</option>
                        <option value="9">أكتوبر</option>
                        <option value="10">نوفمبر</option>
                        <option value="11">ديسمبر</option>
                    </select>
                    <label><i class="fas fa-calendar"></i> السنة:</label>
                    <input type="number" id="sirkatYear" value="2026" min="2020" max="2030" onchange="updateSirkat()" style="width:80px;" />
                </div>
                <div class="sirkat-controls-right">
                    <button class="btn btn-primary" onclick="printSirkat()">
                        <i class="fas fa-print"></i> طباعة
                    </button>
                    <button class="btn btn-gold" onclick="saveSirkatPDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn btn-success" onclick="saveSirkatData()">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                    <button class="btn btn-danger" onclick="clearSirkatData()">
                        <i class="fas fa-undo"></i> إعادة تعيين
                    </button>
                </div>
            </div>

            <!-- ====== الجدول ====== -->
            <div class="sirkat-table-wrap" id="sirkatTableWrap">
                <table class="sirkat-table" id="sirkatTable">
                    <thead>
                        <tr>
                            <th style="width:6%;">#</th>
                            <th style="width:12%;">اليوم</th>
                            <th style="width:12%;">التاريخ</th>
                            <th style="width:10%;">من</th>
                            <th style="width:10%;">إلى</th>
                            <th style="width:10%;">الإجمالي</th>
                            <th style="width:20%;">اسم السائق</th>
                            <th style="width:20%;">توقيع المهندس</th>
                        </tr>
                    </thead>
                    <tbody id="sirkatTableBody">
                        <!-- سيتم تعبئته بواسطة JavaScript -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="5" style="text-align:left; font-weight:bold; padding:8px;">
                                إجمالي ساعات التشغيل:
                            </td>
                            <td id="sirkatTotalHours" style="font-weight:bold; color:var(--primary);">0</td>
                            <td colspan="2" style="text-align:left; font-weight:bold; padding:8px;">
                                عدد أيام التشغيل: <span id="sirkatTotalDays">0</span>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- ====== توقيع المشرف ====== -->
            <div class="sirkat-supervisor">
                <label><i class="fas fa-user-check"></i> المشرف:</label>
                <input type="text" id="sirkatSupervisor" placeholder="اسم المشرف" value="" onchange="saveSirkatSupervisor()" />
                <span style="margin-right:auto; font-size:0.8rem; color:var(--text-light);">* يتم التوقيع عند الطباعة</span>
            </div>

            <!-- ====== زر العودة ====== -->
            <div class="sirkat-back">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i> العودة للرئيسية
                </a>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <script src="js/main.js"></script>
    <script src="js/sirkat.js"></script>
</body>
</html>
