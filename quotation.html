<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/equipment-app/" />
    <title>عرض أسعار إيجار معدات</title>
    
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/quotation.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a6b8a' rx='20'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23c9a84c'%3E🏗️%3C/text%3E%3C/svg%3E" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a6b8a" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تم الحفظ بنجاح</span>
    </div>

    <div id="header"></div>

    <div class="dashboard">
        <div class="quotation-container">
            <div class="page-header">
                <h1><i class="fas fa-file-invoice"></i> عرض أسعار المعدات</h1>
                <div class="header-actions">
                    <button class="btn btn-success" onclick="saveCurrentOffer()">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                    <button class="btn btn-gold" onclick="savePDF()">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button class="btn btn-primary" onclick="openPreview()">
                        <i class="fas fa-eye"></i> معاينة
                    </button>
                </div>
            </div>

            <!-- باقي محتوى صفحة العرض -->
            <div class="saved-offers-row">
                <label><i class="fas fa-history"></i> العروض:</label>
                <select id="savedOffersList" onchange="loadSavedOffer(this.value)">
                    <option value="">-- سابقة --</option>
                </select>
                <button class="btn btn-danger" onclick="deleteSavedOffer()">
                    <i class="fas fa-trash-alt"></i> حذف
                </button>
            </div>

            <!-- ... باقي المحتوى ... -->
        </div>
    </div>

    <div id="footer"></div>

    <!-- المودالات -->
    <div class="modal-overlay" id="previewModal" onclick="if(event.target===this) closePreview()">
        <div class="modal-content">
            <button class="close-modal" onclick="closePreview()"><i class="fas fa-times"></i></button>
            <div id="previewContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="clientModal" onclick="if(event.target===this) closeClientModal()">
        <div class="modal-content client-modal">
            <button class="close-modal" onclick="closeClientModal()"><i class="fas fa-times"></i></button>
            <h3><i class="fas fa-users"></i> إدارة العملاء</h3>
            <div class="add-client-form">
                <input type="text" id="newClientName" placeholder="اسم العميل" />
                <input type="text" id="newClientPhone" placeholder="الهاتف" />
                <input type="email" id="newClientEmail" placeholder="البريد الإلكتروني" />
                <button class="btn btn-success" onclick="addClient()">
                    <i class="fas fa-plus"></i> إضافة
                </button>
            </div>
            <div id="clientListContainer"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/quotation.js"></script>
</body>
</html>
