<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/equipment-app/" />
    <title>سجل التحديثات - نظام عروض المعدات</title>
    
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/changelog.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a6b8a' rx='20'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23c9a84c'%3E🏗️%3C/text%3E%3C/svg%3E" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a6b8a" />
</head>
<body>
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تم بنجاح</span>
    </div>

    <div id="header"></div>

    <div class="dashboard">
        <div class="changelog-container">
            
            <div class="changelog-header">
                <h1><i class="fas fa-history"></i> سجل التحديثات</h1>
                <p class="changelog-subtitle">تعرف على آخر الإضافات والتحسينات في التطبيق</p>
                <div id="newUpdateBadge" style="display:none; background:var(--gold); color:#fff; padding:0.3rem 1rem; border-radius:20px; font-size:0.75rem; margin-top:0.5rem; display:inline-block;">
                    <i class="fas fa-bell"></i> هناك تحديثات جديدة!
                </div>
            </div>

            <div class="changelog-list" id="changelogList">
                <div style="text-align:center;color:var(--text-light);padding:2rem;">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل التحديثات...
                </div>
            </div>

            <div class="changelog-back">
                <a href="dashboard.html" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i> العودة للرئيسية
                </a>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <!-- ====== ترتيب السكربتات المعدل ====== -->
    <script src="js/license.js"></script>
    <script src="js/main.js"></script>
    <script src="js/changelog.js"></script>
</body>
</html>
